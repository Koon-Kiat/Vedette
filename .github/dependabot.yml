# Weekly version updates. Each waits until a release is 14 days old, the
# project's rule for new dependencies; security updates are not delayed.
# Minor and patch updates are grouped into one pull request per ecosystem;
# a major update gets its own.
version: 2
updates:
  - package-ecosystem: uv            # pyproject.toml and uv.lock
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)

  - package-ecosystem: github-actions   # .github/workflows, pinned by commit
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)

  - package-ecosystem: docker          # Dockerfile base images
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)

  - package-ecosystem: docker-compose  # the ollama/ollama image
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: build(deps)
