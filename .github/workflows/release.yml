name: Release

# Pushing a version tag (v0.1.0, matching pyproject.toml) runs every CI check,
# publishes the Vedette image to ghcr.io with a signed build-provenance
# attestation, and creates a GitHub Release whose notes are that version's
# section of CHANGELOG.md. Started by hand, it builds the image and publishes
# nothing. Actions are pinned to a release commit, as in ci.yml.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: image and release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the GitHub Release
      packages: write       # push the image to ghcr.io
      attestations: write   # store the provenance attestation
      id-token: write       # sign it
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the version and gather the release notes
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # ghcr.io image names must be lowercase.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          awk -v heading="## $version" -f .github/release-notes.awk \
            CHANGELOG.md > release-notes.md
          if [ "$PUBLISH" = true ]; then
            if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
              exit 1
            fi
            if ! grep -q '[^[:space:]]' release-notes.md; then
              echo "::error::CHANGELOG.md has no '## $version' section"
              exit 1
            fi
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.version.outputs.image }}
          # 0.1.0, 0.1 and latest for a tag; "dry-run" for a run started by hand.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Vedette
            org.opencontainers.image.description=Watches NextDNS query logs for suspicious DNS activity; a local model explains what the rules find.

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The runtime stage installs Debian's newest security fixes: never reuse it.
          no-cache-filters: runtime

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.version.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Create the GitHub Release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "Vedette $GITHUB_REF_NAME"
          --notes-file release-notes.md
          --verify-tag
