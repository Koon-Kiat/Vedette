# Copy to config.yaml and edit. config.yaml is git-ignored.
# Every value can be overridden by an environment variable: prefix VEDETTE_,
# with "__" between nesting levels, e.g. VEDETTE_LLM__MODEL=qwen3:8b.
# Secrets (NEXTDNS_API_KEY and the notification secrets) never go in this file:
# see .env.example.

profiles:              # IDs are on each profile's Setup page in the NextDNS dashboard
  - id: "ROUTER_PROFILE_ID"
    label: "router"
    enabled: true
  - id: "PC_PROFILE_ID"
    label: "pc"
    enabled: false       # enable once the router profile is collecting cleanly
    # Optional, per profile: silence is normal for a laptop that is often off.
    # stale_after_minutes: 0         # 0 switches the "no events" check off
    # quiet_hours: "23:00-07:00"     # silence in these hours is not counted
  - id: "PHONE_PROFILE_ID"
    label: "phone"
    enabled: false
timezone: "Asia/Singapore"
ingest:
  backfill_days: 7
  raw: false
  page_size: 1000        # entries per history request (NextDNS allows 10 to 1000)
storage:
  database_url: "sqlite+aiosqlite:////data/vedette.db"   # /data is the vedette-data volume
enrich:
  popularity:
    url: "https://tranco-list.eu/top-1m.csv.zip"
    refresh_days: 7
  rdap:
    enabled: true          # false = never ask registries; young-domain goes silent
    bootstrap_url: "https://data.iana.org/rdap/dns.json"
    max_event_age_hours: 24    # no lookups for events older than this
    max_lookups_per_batch: 20
  threat_intel:
    refresh_hours: 24
    feeds:                 # format: domains | hosts | urls
      - name: "phishing_army"
        url: "https://phishing.army/download/phishing_army_blocklist.txt"
        format: "domains"
      - name: "cert_pl"
        url: "https://hole.cert.pl/domains/v2/domains.txt"
        format: "domains"
rules:
  file: null               # optional YAML file overriding values in the packaged rules
  learning_days: 3         # history-based rules stay quiet this long after the first event
allowlist: []              # e.g. - root: "example.com"   (optional: profile, device)
llm:
  base_url: "http://ollama:11434"
  model: "qwen3:8b"
  think: false
  temperature: 0.1
  num_ctx: 8192              # each call is sized so its prompt and answers fit this
  keep_alive: "5m"
  max_findings_per_batch: 20
  cache_ttl_hours: 168
notify:
  channel: "none"            # none | ntfy | discord | email (each needs its secret in .env)
  digest_time: "08:00"       # local time of the daily digest
  quiet_hours: "23:00-07:00" # high alerts wait until these end; critical ones never wait
  alert_cooldown_minutes: 60 # no repeat alert about the same thing within this time
  alert_max_age_minutes: 60  # older findings go to the digest only
  analysis_wait_seconds: 60  # how long an alert waits for the local model's explanation
  ntfy:
    url: "https://ntfy.sh"   # or a self-hosted server; topic in NTFY_TOPIC
  email:
    host: ""                 # e.g. smtp.gmail.com
    port: 587
    security: "starttls"     # starttls (port 587) or ssl (port 465); never unencrypted
    username: ""             # password in SMTP_PASSWORD
    sender: ""
    recipients: []
health:
  check_interval_seconds: 60
  stale_after_minutes: 120   # alert when a profile sends no events for this long
  api_error_minutes: 5       # alert when NextDNS keeps failing for this long
  ollama_down_minutes: 5     # alert when the local model is unreachable for this long
  max_backlog_events: 20000
  backlog_minutes: 15
  max_disk_percent: 90
  healthz_port: 8081         # /healthz on 127.0.0.1 inside the container
dashboard:                   # http://127.0.0.1:8080, login token in DASHBOARD_TOKEN
  enabled: true
  port: 8080                 # keep in step with the port in docker-compose.yml
  session_hours: 12
  allowed_hosts: ["127.0.0.1", "localhost"]   # host names the dashboard answers to
retention:
  events_days: 30
  findings_days: 180
nextdns_write_enabled: false
