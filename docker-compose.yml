name: vedette

services:
  vedette:
    build:
      context: .
      target: runtime
    # A released image instead of a local build: set VEDETTE_IMAGE in .env, e.g.
    # VEDETTE_IMAGE=ghcr.io/koon-kiat/vedette:0.1.0, then `docker compose pull`.
    image: ${VEDETTE_IMAGE:-vedette:local}
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      VEDETTE_CONFIG_FILE: /config/config.yaml
      # Listen on all interfaces inside the container; the port below is
      # published on this machine's loopback address only.
      VEDETTE_DASHBOARD__HOST: 0.0.0.0
    ports:
      # Dashboard. Never write "8080:8080": that would expose it to your network.
      - "127.0.0.1:8080:8080"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /config/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - vedette-data:/data
      # Drop NextDNS log exports here to load them with `vedette import`.
      - ./imports:/imports:ro
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - egress   # outbound to api.nextdns.io
      - llm      # internal only: reaches http://ollama:11434
    stop_grace_period: 30s
    # /healthz listens on 127.0.0.1 inside the container only; this check runs
    # inside the container too. It fails while the service is starting or if
    # its health checks stop running. Keep the port in step with health.healthz_port.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=5)
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3

  # One-shot: hands the model volume to the unprivileged Ollama user (uid 10002)
  # before Ollama starts. It may only change file owners and has no network.
  ollama-volume-owner:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    user: "0:0"
    entrypoint: ["chown", "-R", "10002:10002", "/home/ollama/.ollama"]
    restart: "no"
    network_mode: none
    read_only: true
    volumes:
      - ollama-models:/home/ollama/.ollama
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH

  ollama:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    restart: unless-stopped
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      HOME: /home/ollama     # models and keys live in the volume below
      OLLAMA_NO_CLOUD: "1"   # this server has no internet route; do not call ollama.com
      # The root filesystem is read-only, so CUDA's default kernel cache
      # (~/.nv) cannot be written and the GPU kernels were compiled again on
      # every model load. Keep that cache in the model volume instead.
      CUDA_CACHE_PATH: /home/ollama/.ollama/cuda-cache
      CUDA_CACHE_MAXSIZE: "1073741824"  # 1 GiB; the default 256 MiB can evict
    volumes:
      - ollama-models:/home/ollama/.ollama
    depends_on:
      ollama-volume-owner:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - llm      # no host port and no route to the internet
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot model download. The long-running ollama service has no internet
  # access, so this helper pulls into the shared volume and exits:
  #   docker compose --profile setup run --rm ollama-pull
  ollama-pull:
    image: ollama/ollama:0.40.16@sha256:910d0d8107b538fb0894e63163eb195de0cc7aefcbc666dc62d3b18f71124592
    profiles: [setup]
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve >/dev/null 2>&1 &
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull "$$MODEL"
    environment:
      HOME: /home/ollama
      MODEL: ${VEDETTE_LLM__MODEL:-qwen3:8b}
    volumes:
      - ollama-models:/home/ollama/.ollama
    depends_on:
      ollama-volume-owner:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - egress

  # Lint, type-check and test tooling, so nothing is installed on the host:
  #   docker compose --profile dev run --rm dev pytest
  dev:
    build:
      context: .
      target: dev
    image: vedette-dev:local
    profiles: [dev]
    volumes:
      - .:/app
    networks:
      - egress
      - llm      # lets `pytest --live` reach the local model

networks:
  egress: {}
  llm:
    internal: true

volumes:
  vedette-data: {}
  ollama-models: {}
