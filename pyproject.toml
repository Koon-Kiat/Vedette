[project]
name = "vedette"
version = "0.1.0"
description = "Self-hosted pipeline that flags suspicious DNS activity in NextDNS logs and explains it with a local LLM."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Versioned schema migrations: SQLite now, Postgres later.
    "alembic>=1.20",
    "aiosqlite>=0.22",
    # Dashboard. Web-facing dependencies are pinned exactly, each to a release
    # at least two weeks old when added; bump them deliberately.
    "fastapi==0.162.2",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "jinja2==3.1.6",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "python-multipart==0.0.33",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.1",
    "structlog>=26.1",
    "typer>=0.29",
    # IANA time zone data for zoneinfo: python:3.14-slim ships none.
    "tzdata>=2026.6",
    "uvicorn==0.54.0",
]

[project.scripts]
vedette = "vedette.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23.1",
    "ruff>=0.17",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vedette"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "live: needs real external services (NextDNS, Ollama); skipped unless selected",
]

[tool.coverage.run]
source = ["vedette"]
branch = true
# Alembic loads migration scripts by path, which coverage does not credit. Every test
# database is built by them, and a test checks they match the table definitions.
omit = ["*/storage/migrations/*"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "BLE", "D", "RUF"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
