<svg class="chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-labelledby="chart-title">
  <title id="chart-title">Queries per hour over the last 24 hours, allowed and blocked</title>
  <line class="axis" x1="{{ chart.left }}" y1="{{ chart.top }}" x2="{{ chart.left }}" y2="{{ chart.plot_bottom }}"/>
  <line class="axis" x1="{{ chart.left }}" y1="{{ chart.plot_bottom }}" x2="{{ chart.width }}" y2="{{ chart.plot_bottom }}"/>
  <text class="tick" x="{{ chart.left - 6 }}" y="{{ chart.top + 4 }}" text-anchor="end">{{ chart.y_max|num }}</text>
  <text class="tick" x="{{ chart.left - 6 }}" y="{{ chart.plot_bottom }}" text-anchor="end">0</text>
  {% for bar in chart.bars %}
  <g>
    <title>{{ bar.title }}</title>
    <rect class="bar-allowed" x="{{ bar.x }}" y="{{ bar.allowed_y }}" width="{{ bar.width }}" height="{{ bar.allowed_height }}"/>
    <rect class="bar-blocked" x="{{ bar.x }}" y="{{ bar.blocked_y }}" width="{{ bar.width }}" height="{{ bar.blocked_height }}"/>
    {% if bar.label %}<text class="tick" x="{{ bar.x + bar.width / 2 }}" y="{{ chart.height - 6 }}" text-anchor="middle">{{ bar.label }}</text>{% endif %}
  </g>
  {% endfor %}
</svg>
<p class="legend"><span class="key key-allowed"></span> allowed <span class="key key-blocked"></span> blocked</p>
