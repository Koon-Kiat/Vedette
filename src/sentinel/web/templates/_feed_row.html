<li class="feed-row status-{{ item.status }}" data-id="{{ item.id }}" data-t="{{ item.t }}" data-status="{{ item.status }}" data-profile="{{ item.profile }}"><span class="feed-time">{{ item.time }}</span><span class="feed-domain name">{{ item.domain }}</span><span class="feed-where">{{ item.profile }}{% if item.device %} · <span class="device">{{ item.device }}</span>{% endif %}</span><span class="feed-status">{% if item.status == "blocked" %}<span class="chip chip-blocked" title="{{ item.reason or "Blocked by NextDNS" }}">blocked</span>{% endif %}</span></li>
