<li class="feed-row ink-{{ item.ink }} status-{{ item.status }}" data-id="{{ item.id }}" data-t="{{ item.t }}" data-status="{{ item.status }}"><span class="feed-time">{{ item.time }}</span><span class="feed-layer"><span class="layer-mark layer-mark-{{ item.ink }}"></span><span class="feed-profile">{{ item.profile }}</span></span><span class="feed-domain name">{{ item.domain }}</span><span class="feed-device device">{{ item.device or "" }}</span><span class="feed-status">{% if item.status == "blocked" %}<span class="chip chip-blocked" title="{{ item.reason or "Blocked by NextDNS" }}">blocked</span>{% endif %}</span></li>
