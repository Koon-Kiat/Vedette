{% if rows %}
<div class="table-wrap findings-wrap">
<table class="findings sortable"{% if table_id is defined %} id="t-{{ table_id }}"{% endif %}>
  <thead>
    <tr><th class="col-wide" data-first="descending">No.</th><th data-first="descending" data-sorted="descending">Priority</th><th class="col-wide">Rule</th><th>About</th><th class="col-wide">Profile</th><th class="col-wide" data-first="descending" data-sorted="none">Last seen</th><th class="num col-wide col-xwide">Events</th><th>Status</th><th data-sort="none"><span class="visually-hidden">Actions</span></th></tr>
  </thead>
  <tbody>
    {% for row in rows %}
    {% include "_finding_row.html" %}
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="empty">{{ empty_text if empty_text is defined else "No findings match these filters." }}</p>
{% endif %}
