{% if rows %}
<div class="table-wrap findings-wrap">
<table class="findings">
  <thead>
    <tr><th>No.</th><th>Priority</th><th>Rule</th><th>About</th><th>Profile · device</th><th>Last seen</th><th class="num">Events</th><th>Status</th><th><span class="visually-hidden">Actions</span></th></tr>
  </thead>
  <tbody>
    {% for row in rows %}
    {% include "_finding_row.html" %}
    {% endfor %}
  </tbody>
</table>
</div>
{% else %}
<p class="empty">{{ empty_text if empty_text is defined else "No findings match these filters." }}</p>
{% endif %}
