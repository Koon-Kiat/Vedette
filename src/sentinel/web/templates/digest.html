{% extends "base.html" %}
{% block content %}
<p class="back"><a href="/digests">All digests</a></p>
<header class="page-head">
  <h1>{{ digest.title }}</h1>
  <p class="lead">Period ending {{ digest.period_end|local(tz) }}. Delivery: {{ digest.delivery or "unknown" }}.</p>
</header>
<pre class="digest">{{ digest.body }}</pre>
{% endblock %}
