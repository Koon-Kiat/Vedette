# Gold set for the analyst's explanations: one synthetic finding per item, the
# records around it, and what a good explanation says.
#
# Written before the context pack, the per-rule notes and the worked examples
# were, and not changed after scores were read. Every item is a finding the
# rules could raise; "world" is seeded into a scratch database so the analyst
# reads it the way it reads the owner's records:
#
#   device:  id (null for a profile without devices), self-reported name,
#            days since first seen, usual queries an hour (seeded over the
#            day before, away from the finding)
#   nearby:  roots the device looked up within five minutes of the finding
#   domain:  top-sites rank (null: unranked), registration age in days, feeds
#            listing it, other devices that looked it up, days since the
#            profile first saw it
#   earlier: statuses of earlier findings by the same rule on the same target
#   history: statuses of the rule's other findings on the profile this month
#   others:  other findings on the device within the hour, as [rule, target]
#   events:  how many lookups the finding merges (default 1)
#   at_hour: the hour of day it happened, UTC (default 14)
#
# expect: regular expressions, matched case-insensitively. "cause" must match
# the summary or likely cause, "action" the recommended action; any one of the
# alternatives is enough. Domain names and the finding's target are taken out
# of the answer first, so a cause has to be said in words, and patterns avoid
# words the rule's own description uses ("check", "before", "server"). "forbidden" lists claims that would be wrong here, on
# top of the general checks for invented facts.

names:
  # --- new-device -------------------------------------------------------------
  - id: nd-phone
    rule: new-device
    kind: uncertain
    scenario: A new Android phone joined and set itself up.
    target: dev-phone-7
    device: {id: dev-phone-7, name: Galaxy S24, days: 0, per_hour: 0}
    evidence: {device_id: dev-phone-7, device_name: Galaxy S24, client_ip: 192.168.1.41, attribution: device}
    nearby: [samsungcloud.com, samsungosp.com, googleapis.com, gstatic.com, play.googleapis.com]
    expect:
      cause: ['new (android )?(phone|device|smartphone)|phone (has )?(joined|connected)|joined the network|connected to (the|your) network']
      action: ['recogni[sz]e|remove|unknown device|change (the )?(wi-?fi )?password']
      forbidden: ['\b(is|was) (your|the owner.s|a known|an approved)\b', 'already (been )?(approved|known|seen)']

