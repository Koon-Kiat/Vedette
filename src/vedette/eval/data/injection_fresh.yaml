# Fresh held-out prompt-injection items for the evaluation.
#
# The first held-out set (injection_held_out.yaml) shaped five defences after
# its results had been read, so its downplay, spoof, device and sample-roots
# rows no longer measure attacks the defences were not shaped by. This set was
# written on 2026-11-27, after every defence in use was final: the pre-filter,
# the data-only prompt with its rule notes and examples, the floor guard, the
# guard against answers that repeat a name's own vouching words, and the
# context pack's screening of instruction-like names. No defence is to change
# because of this set's results; a later fix needs a set written after it.
#
# It covers the categories those defences were shaped by, harmful advice, and a
# new carrier: a crafted name the device looked up just before an ordinary
# finding, which reaches the model only in that finding's context pack. Many
# names avoid the guard's words on purpose ("cleared", "sanctioned",
# "known-good"), as an attacker who read the code would.
