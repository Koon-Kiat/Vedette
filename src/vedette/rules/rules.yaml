# Detection rules. Each rule has an id, a plain name the dashboard shows, a
# severity floor, a description of why it matters, thresholds (params), the
# evidence fields it records, and notes for the local model: harmless
# look-alikes to rule out and checks worth suggesting, sent with the rule's
# findings as trusted text.
#
# The detector for each id is code; everything tunable is here. To change a
# value without editing this file, point `rules.file` in config.yaml at a YAML
# file with the same shape containing only the ids and fields to override.
#
# When NextDNS reports no device for an event (typical for a router profile),
# per-device rules count per profile instead.
#
# Hosting platforms that name each customer resource themselves (storage
# buckets, CDN distributions, cloud endpoints). A random-looking label under
# one says nothing about malware, so the name-based rules skip them. Names
# under platforms where the customer picks the label (github.io, pages.dev,
# duckdns.org) are still judged. A root matches an entry when it is the entry
# or ends in "." plus the entry.
assigned_name_platforms: &assigned_name_platforms
  # Amazon Web Services
  - amazonaws.com
  - cloudfront.net
  - awsglobalaccelerator.com
  - on.aws
  - amplifyapp.com
  # Microsoft Azure
  - windows.net
  - azure.com
  - azureedge.net
  - azurefd.net
  - azurewebsites.net
  - azurestaticapps.net
  - azurecontainer.io
  - cloudapp.net
  - trafficmanager.net
  # Google Cloud
  - googleapis.com
  - googleusercontent.com
  - usercontent.goog
  - run.app
  - cloudfunctions.net
  # Content delivery networks
  - akamai.net
  - akamaiedge.net
  - akamaihd.net
  - akamaized.net
  - edgekey.net
  - edgesuite.net
  - fastly.net
  - fastly-edge.com
  - fastlylb.net
  # Other clouds
  - yandexcloud.net

rules:
  - id: new-device
    name: New device
    severity: medium
    dedupe: once
    description: >-
      A device id that has never been seen on this profile appeared (or, when
      NextDNS reports no devices, a client IP never seen before). An unknown
      device on the network may be a guest, a new purchase, or an intruder.
    params: {}
    evidence: [device_id, device_name, client_ip, attribution]
    analyst_notes:
      look_alikes:
        - >-
          A phone, tablet or laptop that changed its private Wi-Fi address, or
          rejoined after a reset, shows up as new. Many such findings marked
          benign before point to this.
        - >-
          A guest's device, or a new purchase being set up. Its first lookups
          go to its maker's cloud and app stores.
      checks:
        - >-
          Ask who added a device at that time. The names it looked up first
          usually show its maker or kind.
        - >-
          If nobody recognises it, remove it from the network and change the
          Wi-Fi password.

  - id: young-domain
    name: Newly registered domain
    severity: high
    dedupe: daily
    description: >-
      An allowed query went to a domain registered very recently that is not
      on the top-sites list. Freshly registered, unknown domains are heavily
      used for phishing and malware delivery before blocklists catch up.
    params:
      max_age_days: 30
    evidence: [fqdn, root, status, domain_age_days, popularity_rank]
    analyst_notes:
      look_alikes:
        - >-
          A shop, service or tool that launched recently, reached the usual way
          (a search, a link from a known site, a work app).
        - A new advertising or tracking domain loaded by a page among other ad networks.
      checks:
        - >-
          Look at what was open just before. A link in an email or a message
          leading to a sign-in or download page is the usual phishing path.
        - >-
          Never enter a password on such a page; if something was downloaded,
          scan the device for malware.

  - id: threat-intel-allowed
    name: Threat-feed domain allowed
    severity: critical
    dedupe: daily
    description: >-
      NextDNS allowed a query for a domain that a threat-intelligence feed
      lists as malicious. The device may have reached a phishing or malware
      site that the resolver did not block.
    params:
      trusted_rank: 1000      # a feed entry for a top site this popular is distrusted
    evidence: [fqdn, root, status, threat_feeds, threat_match, popularity_rank]
    analyst_notes:
      look_alikes:
        - >-
          A feed can list a whole shared host, or keep an entry after it was
          cleaned. Many devices using the domain for a long time suggest this.
      checks:
        - >-
          Find what led there: a link in an email, an advert redirect, a
          mistyped address.
        - >-
          Scan the device for malware, change any password typed there, and
          block the domain in NextDNS.

  - id: dga-like
    name: Random-looking domain name
    severity: medium
    dedupe: daily
    description: >-
      An allowed query went to a domain outside the top-sites list whose
      registered name looks like random characters rather than words. Malware
      often generates such names to find its command-and-control server.
    params:
      # The label judged is the one left of the public suffix (or a
      # customer's name on a hosting platform), whatever stands in front.
      # min_randomness: bits by which random characters explain it better than real
      # domain labels do. 20 bits is odds of about a million to one; it flags
      # 0.4% of real registered labels of 8 or more characters
      # (tools/label_model.py prints the calibration).
      min_randomness: 20
      min_label_length: 8
      assigned_name_platforms: *assigned_name_platforms
    evidence: [fqdn, root, status, label, label_length, randomness, digit_ratio]
    analyst_notes:
      look_alikes:
        - >-
          Ad, tracking and email-link services sometimes use random-looking
          names. A web page or webmail loads them, next to other ad or mail
          services.
        - >-
          Smart home devices may talk to their maker's cloud under a
          random-looking name every day for months.
      checks:
        - >-
          Next to other random names or a burst of new domains, scan the device
          for malware.
        - >-
          If one device has used it daily for a long time, check the device's
          maker before treating it as malware.

  - id: tunnel-like
    name: Possible DNS tunnelling
    severity: high
    dedupe: hourly
    description: >-
      One device queried many different long subdomains of a single domain in
      a short time. That pattern is typical of DNS tunnelling, where data is
      smuggled out inside query names.
    params:
      min_unique_subdomains: 30   # fires when the count exceeds this
      window_minutes: 10
      min_subdomain_length: 30    # characters in front of the root
      ignore_rank_below: 10000    # skip roots this popular (large CDNs); null disables
    evidence: [root, unique_subdomains, window_minutes, sample_fqdn]
    analyst_notes:
      look_alikes:
        - >-
          Antivirus and endpoint security look up file hashes and addresses as
          long subdomains of the vendor's domain; the vendor's other domains
          are looked up around them.
        - >-
          Mail servers check senders against spam blocklists (DNSBL) by looking
          up reversed addresses as subdomains.
        - Monitoring tools and smart TVs send metrics or viewing data encoded in subdomains.
      checks:
        - >-
          Name the program behind the lookups: the domains looked up around
          them usually show it. For security software or a mail filter, no
          action is needed.
        - >-
          If nothing explains it, above all with a new domain, disconnect the
          device and scan it for malware.

  - id: tunnel-slow
    name: Slow DNS tunnelling
    severity: medium
    dedupe: daily
    description: >-
      One device queried many different long subdomains of a single domain
      over a few hours. A tunnel that sends a query a minute stays under the
      fast tunnelling rule, but its subdomains add up here.
    params:
      min_unique_subdomains: 60   # fires when the count exceeds this
      window_minutes: 360
      min_subdomain_length: 30    # characters in front of the root
      ignore_rank_below: 10000    # skip roots this popular (large CDNs); null disables
    evidence: [root, unique_subdomains, window_minutes, sample_fqdn]
    analyst_notes:
      look_alikes:
        - >-
          Antivirus and endpoint security look up file hashes and addresses as
          long subdomains of the vendor's domain; the vendor's other domains
          are looked up around them.
        - >-
          Mail servers check senders against spam blocklists (DNSBL) by looking
          up reversed addresses as subdomains.
        - Monitoring tools and smart TVs send metrics or viewing data encoded in subdomains.
      checks:
        - >-
          Name the program behind the lookups: the domains looked up around
          them usually show it. For security software or a mail filter, no
          action is needed.
        - >-
          If nothing explains it, above all with a new domain, disconnect the
          device and scan it for malware.

  - id: dga-burst
    name: Burst of new unknown domains
    severity: medium
    dedupe: hourly
    description: >-
      One device looked up many domains it had never queried before, none of
      them on the top-sites list, within a few minutes. Malware that generates
      domain names tries dozens of them to find its server, whatever the names
      look like.
    params:
      min_new_roots: 20           # fires when the count exceeds this
      window_minutes: 10
      assigned_name_platforms: *assigned_name_platforms
    evidence: [new_roots_in_window, window_minutes, sample_roots]
    analyst_notes:
      look_alikes:
        - Busy web pages load dozens of ad, tracking and content domains in minutes.
        - >-
          A device being set up, or a script that crawls or checks links, looks
          up many new domains at once.
      checks:
        - >-
          Random or joined-word names that nothing else explains point to
          malware: scan the device.
        - >-
          If the names are ordinary sites, ad networks or the device maker's,
          no action is needed.

  - id: volume-spike
    name: Query volume spike
    severity: low
    dedupe: hourly
    description: >-
      A device made far more queries this hour than its usual hourly rate.
      Sudden bursts can mean malware activity, a misbehaving app, or a new
      heavy use of the device.
    params:
      factor: 5.0             # this hour vs the baseline hourly mean
      baseline_hours: 168     # look back one week
      min_baseline_hours: 24  # hours with data needed before judging
      min_queries: 200        # ignore spikes smaller than this
    evidence: [queries_this_hour, baseline_per_hour, factor]
    analyst_notes:
      look_alikes:
        - >-
          Operating system and game updates, cloud backups and photo syncs make
          many lookups for an hour.
        - An app full of advertising and analytics libraries.
      checks:
        - >-
          The names looked up in that hour usually show the cause, such as an
          update or backup service; then no action is needed.
        - >-
          Hundreds of lookups of mail servers or random names point to a spam
          bot or malware: disconnect the device and scan it.

  - id: blocked-burst
    name: Burst of blocked queries
    severity: medium
    dedupe: hourly
    description: >-
      One device had many queries blocked in a short window. That can indicate
      adware or malware repeatedly trying to reach blocked servers.
    params:
      min_blocked: 50               # per device
      min_blocked_profile_mode: 200 # whole profile, when devices are not reported
      window_minutes: 10
    evidence: [blocked_in_window, window_minutes, sample_fqdn]
    analyst_notes:
      look_alikes:
        - Smart TVs and apps retry blocked telemetry and analytics hosts many times a minute.
        - Parental controls blocking games or social sites a child keeps trying.
      checks:
        - >-
          If the blocked names are trackers or adverts, no action is needed; if
          they are random names, scan the device for malware.
        - >-
          If a browser keeps reaching ad networks, look for an adware extension
          and remove it.

  - id: new-destination-category
    name: New category or blocklist
    severity: low
    dedupe: once
    description: >-
      A device triggered a NextDNS category or blocklist (the reason attached
      to a query) that it had never triggered before, which signals a change
      in what the device is doing.
    params: {}
    evidence: [category, category_name, fqdn]
    analyst_notes:
      look_alikes:
        - Ad and tracker blocklists match on new devices and new apps all the time.
      checks:
        - >-
          Say what was reached from the category name. For gambling or adult
          sites on a family device, talk to its user or adjust parental
          controls.
        - >-
          For a threat or newly registered domain category, find which link led
          there and scan the device.
