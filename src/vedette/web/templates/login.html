{% extends "base.html" %}
{% block content %}
<section class="login panel">
  <h1>Vedette</h1>
  <p>Enter the dashboard token from your <code>.env</code> file (<code>DASHBOARD_TOKEN</code>).</p>
  {% if error %}<p class="error" id="login-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" autocomplete="off">
    <input type="hidden" name="login_nonce" value="{{ nonce }}">
    <label for="token">Token</label>
    <input id="token" name="token" type="password" required autofocus{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
    <button type="submit" class="primary">Log in</button>
  </form>
</section>
{% endblock %}
